<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Spider-Verse favicon: stylized spider silhouette on Miles' purple/red gradient.
       Designed to read at 16px: heavy bold silhouette, no thin strokes. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#7b2fff"/>
      <stop offset="55%" stop-color="#3a0a66"/>
      <stop offset="100%" stop-color="#0a0015"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark backdrop with universe glow -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)" opacity="0.6"/>

  <!-- Spider, centered. Bulbous abdomen + cephalothorax + 8 legs. -->
  <g fill="#ff2d2d">
    <!-- Body: abdomen (lower oval) + thorax (upper circle) -->
    <ellipse cx="32" cy="36" rx="9" ry="11"/>
    <circle cx="32" cy="24.5" r="6.5"/>

    <!-- Legs: 4 per side, each a 2-segment kink. Stroke widths kept chunky for 16px legibility. -->
    <!-- Left side -->
    <path d="M26 22 L14 14 L8 18"  stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M25 28 L11 24 L6 30"  stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M25 34 L10 36 L7 44"  stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M26 41 L14 47 L11 56" stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Right side -->
    <path d="M38 22 L50 14 L56 18" stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M39 28 L53 24 L58 30" stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M39 34 L54 36 L57 44" stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M38 41 L50 47 L53 56" stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Spider-emblem cross on the abdomen (optional micro-detail; reads as texture at 16px) -->
    <path d="M32 28 L32 46 M28 36 L36 36" stroke="#0a0015" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
