<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Impact, 'Bangers', 'Arial Black', sans-serif">
  <defs>
    <radialGradient id="bg" cx="38%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#3a0a66"/>
      <stop offset="55%" stop-color="#150028"/>
      <stop offset="100%" stop-color="#0a0015"/>
    </radialGradient>

    <!-- 4 universe color slabs as diagonal "rips" across the right side -->
    <linearGradient id="g1610" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff2d2d"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
    <linearGradient id="g65" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6ec6f5"/>
      <stop offset="100%" stop-color="#f5c6d0"/>
    </linearGradient>
    <linearGradient id="g138" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d44d"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="g928" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0057ff"/>
    </linearGradient>

    <!-- Halftone dot pattern overlay -->
    <pattern id="halftone" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.4" fill="#ff2d2d" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- 4 diagonal universe-color rips on the right side, layered torn-paper style -->
  <g transform="translate(720 -40) rotate(8)" opacity="0.92">
    <polygon points="0,40 520,0 540,150 20,190"     fill="url(#g1610)"/>
    <polygon points="0,200 540,160 555,300 15,340"  fill="url(#g65)"/>
    <polygon points="0,350 555,310 568,460 10,500"  fill="url(#g138)"/>
    <polygon points="0,510 568,470 580,620 5,660"   fill="url(#g928)"/>
  </g>

  <!-- Big bold spider mark on the left -->
  <g transform="translate(100 280) scale(2.4)" fill="#ff2d2d">
    <ellipse cx="32" cy="36" rx="9" ry="11"/>
    <circle cx="32" cy="24.5" r="6.5"/>
    <g stroke="#ff2d2d" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M26 22 L14 14 L8 18"/>
      <path d="M25 28 L11 24 L6 30"/>
      <path d="M25 34 L10 36 L7 44"/>
      <path d="M26 41 L14 47 L11 56"/>
      <path d="M38 22 L50 14 L56 18"/>
      <path d="M39 28 L53 24 L58 30"/>
      <path d="M39 34 L54 36 L57 44"/>
      <path d="M38 41 L50 47 L53 56"/>
    </g>
  </g>

  <!-- Title block -->
  <g fill="#f0e6ff">
    <text x="100" y="170" font-size="92" font-weight="900" letter-spacing="2">SPIDER-VERSE</text>
    <text x="100" y="252" font-size="92" font-weight="900" letter-spacing="2" fill="#ff2d2d">PORTFOLIO.</text>

    <!-- Stinger / tagline -->
    <text x="100" y="540" font-size="22" font-family="'Courier New', 'Share Tech Mono', monospace" letter-spacing="3" fill="#c0f0ff" opacity="0.85">
      FOUR EARTHS  ·  ONE SPIDER  ·  A DIMENSIONAL EVENT
    </text>
    <text x="100" y="582" font-size="18" font-family="'Courier New', 'Share Tech Mono', monospace" letter-spacing="4" fill="#7b2fff" opacity="0.7">
      SMARTH SHOKEEN  //  EARTH-1610 → EARTH-928
    </text>
  </g>

  <!-- Scanline texture overlay for the 2099 corner -->
  <g opacity="0.18">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
  </g>
</svg>
