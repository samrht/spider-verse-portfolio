<!doctype html>
<html lang="en" data-universe="earth-1610">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0015" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0f8" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font perf: preconnect to Google Fonts before the CSS request fires. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Spider-Verse Portfolio</title>
    <meta
      name="description"
      content="A cinematic Spider-Verse themed developer portfolio. Not a fan page — a dimensional event."
    />

    <!-- Open Graph / social -->
    <meta property="og:title" content="Spider-Verse Portfolio" />
    <meta
      property="og:description"
      content="Cross-universe developer portfolio. Four Earths. One Spider."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui;color:#f0e6ff;background:#0a0015;text-align:center;">
        <h1>Spider-Verse Portfolio</h1>
        <p>This site is a JavaScript-driven cinematic experience. Please enable JavaScript to swing through.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
